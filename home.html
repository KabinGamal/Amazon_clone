<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="nav_bar">
            <div class="nav_logo border">
                <div class="logo"></div>
            </div>

            <div class="location border">
                <p class="add_1">Deliver to</p>
                <div class="loc_icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add_2">Nepal</p>
                </div>
            </div>

            <div class="nav_search">
                <select class="depart">
                    <option> All </option>
                </select>
                <input placeholder="Search Amazon" class="search">

                <div class="search_icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="lang_border">
                <div class="flag"></div>
                <select class="language">
                    <option>EN</option>
                </select>
            </div>

            <div class="accounts border">
                <div class="welcome">
                    <p>Hello, sign in</p>
                    <select class="Account"> 
                        <option>Account & Lists</option>
                    </select>
                </div>
            </div>
            <div class="welcome border">
                <p>Returns</p>
                <span class="welcome_second">& Orders</span>     
            </div>  
            <div class="cart border">
                <i class="fa-solid fa-cart-shopping"></i>  
                <div class="cart_txt">Cart</div>       
            </div>
        </div>
    
        <div class="pannel">
            <div class="pannel_1">
                <i class="fa-solid fa-bars"></i>
                <p>All</p>
            </div>

                <div class="pannel_2">
            <div class="pannel_2">
                    <p class="border1">Amazon Haul</p>
                    <p class="border1"> Medical Care </p>
                    <p class="border1">Amazon Basics</p>
                    <p class="border1">Best Sellers</p>
                    <p class="border1">Books</p>
                    <p class="border1">Prime</p>
                    <p class="border1">Gift Cards</p>
                    <p class="border1">Registry</p>
                    <p class="border1">Groceries</p>
                    <p class="border1">Smart Home</p>
                    <p class="border1">New releases</p>
                    <p class="border1">Sell</p>
                    <p class="border1">Music</p>
                </div>
            </div>
        </div>
    </header>

    <div class="hero_section">
        
    </div>
</body>

</html>
